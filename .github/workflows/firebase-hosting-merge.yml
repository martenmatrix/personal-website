name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: personal-website-7516d
    steps:
      - name: Checkout code with cached Git LFS files
        uses: nschloe/action-cached-lfs-checkout@v1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Optimize pngs
        run: npm run optimizepngs ${{ secrets.TINIFY_API_KEY }} replace
      - name: Optimize gifs
        run: npm run optimizegifs replace
      - name: Create production bundle
        run: npm run build
      - name: Authenticate for Hosting site provisioning
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PERSONAL_WEBSITE_7516D }}'
      - name: Ensure Firebase Hosting site exists
        run: npx --yes --package=firebase-tools@15.32.1 -- bash .github/scripts/ensure-firebase-hosting-site.sh
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PERSONAL_WEBSITE_7516D }}'
          channelId: live
          projectId: '${{ env.FIREBASE_PROJECT_ID }}'
